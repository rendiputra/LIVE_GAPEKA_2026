[project]
name = "live-gapeka"
version = "0.1.0"
description = "Estimated train positions from the Gapeka 2026 timetable (Java)"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "osmium>=4.3.2",
    "pdfplumber>=0.11.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["pipeline", "engine", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The Leaflet page is a long inline HTML/CSS/JS template.
"pipeline/geometry_review.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "engine", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
