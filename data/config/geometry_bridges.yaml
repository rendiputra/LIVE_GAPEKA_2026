# Manual geometry bridges - AUTHORED BY THE HUMAN.
#
# A bridge joins two OSM nodes that are physically the same track but were not
# connected in the extract (a digitising seam, a missing junction, or a station
# node isolated on a small fragment).
#
# The pipeline never invents a bridge. build_geometry reads this file, adds a
# synthetic edge, and records it in the report so it is never invisible.
#
# Schema:
#   bridges:
#     - pair:        ["KH", "MA"]        # station codes the bridge serves (for the report)
#       from_node:   <OSM node id>
#       to_node:     <OSM node id>
#       reason:      "<why these are the same track>"
#       evidence:    "<a reference, a survey note, or the measured gap>"
#       decided_by:  "<your name>"
#       date:        "<YYYY-MM-DD>"
bridges:
  # Q1: approved by the human on 2026-11-22.
  # The KH/MA/SKP fragment (13 nodes, ~-7.619, 109.138) sits 3.1 m from the main
  # network. That is a digitising seam, not a missing line.
  - pair: ["KH", "MA"]
    from_node: 9926535859
    to_node: 12115596723
    reason: "3.1 m digitisation seam; nearest main-network node to the 13-node fragment"
    evidence: "data/review/a6_kh_component.json"
    decided_by: "human"
    date: "2026-11-22"
