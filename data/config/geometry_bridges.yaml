# Manual geometry bridges - AUTHORED BY THE HUMAN.
#
# A bridge joins two OSM nodes that are physically the same track but were not
# connected in the extract (a digitising seam, a missing junction, or a station
# node isolated on a 13-node fragment).
#
# The pipeline never writes this file. build_geometry reads it and adds a
# synthetic edge, recording it in the report.
#
# Schema:
#   bridges:
#     - pair:        ["KH", "MA"]        # station codes the bridge serves (for the report)
#       from_node:   <OSM node id>
#       to_node:     <OSM node id>
#       reason:      "<why these are the same track>"
#       evidence:    "<a reference, a survey note, or the measured gap>"
#       decided_by:  "<your name>"
#       date:        "<YYYY-MM-DD>"
#
# Evidence gathered so far for the KH-MA-SKP fragment (data/review/a6_kh_component.json):
#   the 13-node component sits at about -7.619, 109.138
#   its nearest main-network node is 9926535859 -> 12115596723 at 3.1 m
#   that is a digitising seam, not a missing line. A human must decide whether to
#   bridge it.
bridges: []
